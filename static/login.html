<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login - Sumangal Auto Billing</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230C54A0'><path d='M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.04 3H5.81l1.04-3zM19 17H5v-4.66l.12-.34h13.77l.11.34V17z'/><circle cx='7.5' cy='14.5' r='1.5'/><circle cx='16.5' cy='14.5' r='1.5'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <!-- Blue Header -->
        <div class="bg-[#0C54A0] px-6 py-8 text-center text-white">
            <h1 class="text-2xl font-bold tracking-wide">SUMANGAL AUTO BILLING</h1>
            <p class="text-xs text-blue-100 uppercase tracking-widest mt-1">Sachin's Sumangal Services • Maruti Servicing Centre</p>
        </div>
        
        <!-- Form Content -->
        <div class="p-6 md:p-8">
            <h2 class="text-xl font-bold text-slate-800 text-center mb-6">Owner PIN Login</h2>
            
            <div id="error-message" class="hidden mb-4 p-3 bg-red-50 text-red-600 rounded-lg text-sm text-center border border-red-200 font-medium"></div>

            <form id="login-form" class="space-y-6">
                <div>
                    <label for="pin" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Enter Secure PIN</label>
                    <input 
                        type="password" 
                        inputmode="numeric" 
                        pattern="[0-9]*" 
                        id="pin" 
                        maxlength="6"
                        placeholder="••••" 
                        class="w-full text-center tracking-[1em] text-2xl font-bold py-3 px-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-[#0C54A0] focus:border-[#0C54A0] outline-none transition-all placeholder:tracking-normal placeholder:text-slate-300"
                        required
                        autofocus
                    >
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-[#0C54A0] text-white font-bold py-4 px-6 rounded-xl hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 active:scale-[0.98] transition-transform text-lg"
                >
                    Login
                </button>
            </form>
            
            <div class="mt-8 text-center">
                <a href="/admin-login.html" class="text-sm font-medium text-[#0C54A0] hover:underline">Admin Dashboard Log In</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const pin = document.getElementById('pin').value;
            const errorDiv = document.getElementById('error-message');
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin })
                });

                const data = await response.json();
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    errorDiv.innerText = data.error || "Login failed. Try again.";
                    errorDiv.classList.remove('hidden');
                    document.getElementById('pin').value = '';
                }
            } catch (err) {
                errorDiv.innerText = "Something went wrong. Please try again.";
                errorDiv.classList.remove('hidden');
            }
        });

        // Auto-check auth status on load
        window.addEventListener('load', async () => {
            try {
                const res = await fetch('/api/auth/status');
                const data = await res.json();
                if (data.logged_in && data.role === 'owner') {
                    window.location.href = '/';
                }
            } catch (e) {}
        });
    </script>
</body>
</html>
